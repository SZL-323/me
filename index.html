<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邵钟琳</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f7f4ef 0%, #eef0f6 55%, #e9e6f2 100%);
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      color: #3c3c43;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(90, 90, 130, 0.13);
      padding: 38px 32px 34px;
      text-align: center;
    }

    .avatar {
      width: 132px;
      height: auto;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(120, 120, 160, 0.18));
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-3px) scale(1.015); }
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .sub {
      font-size: 13px;
      color: #8e8e93;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .divider {
      width: 44px;
      height: 2px;
      margin: 0 auto 22px;
      background: linear-gradient(90deg, #c7c3e0, #a9b4d8);
      border-radius: 2px;
    }

    .line {
      font-size: 14px;
      line-height: 2;
      color: #55555e;
    }

    .tag {
      display: inline-block;
      margin-top: 26px;
      font-size: 12px;
      color: #8b87a8;
      border: 1px solid #ddd8ee;
      border-radius: 999px;
      padding: 5px 14px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 30px;
      font-size: 11px;
      color: #b3b0c2;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="pet.png" alt="avatar" />
    <h1>邵钟琳</h1>
    <p class="sub">软件技术 · 武汉</p>
    <div class="divider"></div>
    <p class="line">正在学前端</p>
    <p class="line">第一版，2026 年 10 月</p>
    <span class="tag">这是我自己做的</span>
    <footer id="foot">每天进步一点点</footer>
  </main>
</body>
</html>
